name: Validar origen OpenCode

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

jobs:
  authorize-change:
    name: Solo cambios de OpenCode
    runs-on: ubuntu-latest
    env:
      # Valor esperado con la GitHub App oficial: opencode-agent[bot].
      # Confírmalo en la primera PR que cree la app y configúralo como variable
      # de Actions: OPENCODE_GITHUB_ACTOR.
      ALLOWED_PR_AUTHOR: ${{ vars.OPENCODE_GITHUB_ACTOR }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Rechazar una PR que no sea de OpenCode
        shell: bash
        run: |
          if [ -z "$ALLOWED_PR_AUTHOR" ]; then
            echo "Falta configurar la variable OPENCODE_GITHUB_ACTOR."
            exit 1
          fi
          if [ "$PR_AUTHOR" != "$ALLOWED_PR_AUTHOR" ]; then
            echo "PR rechazada: '$PR_AUTHOR' no es el bot OpenCode autorizado '$ALLOWED_PR_AUTHOR'."
            exit 1
          fi
          echo "PR autorizada desde OpenCode: $PR_AUTHOR"

  tests:
    name: Pruebas del login
    needs: authorize-change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
