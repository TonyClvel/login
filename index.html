<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso | Aula IA</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro" aria-labelledby="site-title">
        <p class="eyebrow">Certificación IA · Campus</p>
        <h1 id="site-title">Vuelve a tu mesa de trabajo.</h1>
        <p class="intro-copy">Tus módulos, ejercicios y avances están listos para continuar.</p>
        <div class="signal" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      </section>

      <section class="card" aria-labelledby="login-title">
        <p class="card-kicker">Acceso seguro</p>
        <h2 id="login-title">Inicia sesión</h2>
        <p class="hint">Usa tu correo institucional para entrar.</p>
        <form id="login-form" novalidate>
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@campus.edu" required />
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <p id="form-message" class="message" role="status" aria-live="polite"></p>
          <button type="submit">Entrar al campus <span aria-hidden="true">→</span></button>
        </form>
        <details>
          <summary>¿Quieres probarlo?</summary>
          <p>Correo: <code>demo@campus.edu</code><br />Contraseña: <code>Aprende2026!</code></p>
        </details>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
